# 消融第 1 级（+③ wiki 分层摘要索引）：naive + 条目层检索路由（wiki 工具）
# 工具 = bm25 + dense + wiki（三路 RRF 融合；chunk 层两路为兜底）
# 需先构建索引：scripts/build_wiki.py --benchmarks <bench>
agent:
  top_k: 10
  max_rounds: 1
  use_dense: true
  use_wiki: true
  use_rewrite: false
  use_decision: false
  answer_max_tokens: 1024
  answer_retry_budgets: [2048, 4096]
