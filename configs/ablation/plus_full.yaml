# 消融收官行（全家桶，2026-10-11）：决策层 + 实体图 + 查询侧增强
# = plus_decision.yaml + use_kg: true。决策形态下 ② 的作用：子问题分解由 planner 承担，
# 本开关启用近重合并（余弦≥0.92）与改写变体通路；③ 以第三路工具（等权 RRF）参与逐轮检索。
# 预期：决策层的规划/早停 + 实体图的证据覆盖两头兼得。依赖小库实体图 + 查询 NER 缓存。
agent:
  top_k: 10
  max_rounds: 3
  max_evidence: 20
  use_dense: true
  use_wiki: false
  use_kg: true
  use_rewrite: true
  use_decision: true
  answer_max_tokens: 1024
  answer_retry_budgets: [2048, 4096]
