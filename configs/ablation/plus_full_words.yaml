# 答案格式实验 B 臂：plus_full + 硬性词数上限（见 docs/experiment-answer-format.md）
# 与 plus_full 的唯一差异是 strict_answer_words；A 臂直接用 plus_full.yaml。
agent:
  top_k: 10
  max_rounds: 3
  max_evidence: 20
  use_dense: true
  use_wiki: false
  use_kg: true
  use_rewrite: true
  use_decision: true
  answer_max_tokens: 1024
  answer_retry_budgets: [2048, 4096]
  strict_answer_words: 5
